  /* Cagnotte de l'événement : lien PayPal, objectif et total reçu. */
  function potCard(ev) {
    // En ligne, un chef ou un membre ne voit pas la liste des dons : seulement le total calculé chez l'organisateur.
    var recs = ev.contributions.filter(function (c) { return c.status === 'recu'; }), hide = ON.on && !recs.length;
    if (isMember()) return '<div class="card mt pot"><h2>Cagnotte de l\'événement</h2><div class="pot-row"><div class="pot-main"><p class="muted">Chacun peut participer aux frais de l\'événement.</p></div><div class="m-actions">' + btn('💛 Contribuer', 'contribute', 'btn-gold btn-lg') + (ev.paypal ? btn('Partager le lien', 'share-pot', '') : '') + '</div></div></div>';
    var rec = hide ? Number(ev.potTotal) || 0 : sum(recs, 'amount'), nRec = hide ? Number(ev.potCount) || 0 : recs.length, goal = Number(ev.goal) || 0;
    var h = '<div class="card mt pot"><h2>Cagnotte de l\'événement</h2><div class="pot-row"><div class="pot-main"><p><b class="big-num">' + fmtMoney(rec) + '</b> reçus' + (goal ? ' sur un objectif de <b>' + fmtMoney(goal) + '</b>' : '') + '</p>' +
      (goal ? bar(Math.round(rec / goal * 100)) : '') + '<small class="muted">' + plur(nRec, 'contribution', 'contributions') + '</small></div>' +
      '<div class="m-actions">' + btn('💛 Contribuer', 'contribute', 'btn-gold btn-lg') + (ev.paypal ? btn('Partager le lien', 'share-pot', '') : '') + '</div></div>';
    if (isTreasurer(ev)) h += quickContrib();
    return h + '</div>';
  }
  function quickContrib() {
    return '<form class="add-member quick-contrib" data-form="add-contrib"><input name="who" placeholder="Nom de la personne" aria-label="Nom"><input name="amount" inputmode="decimal" placeholder="Montant reçu (€)" aria-label="Montant"><button class="btn btn-primary btn-sm" type="submit">+ Noter un don reçu</button></form>';
  }

  function membersCard(ev, t) {
    var edit = canEditTeam(t.id), ms = teamMissions(ev, t.id);
    var tasksOf = function (name) {
      var n = 0, d = 0, low = name.toLowerCase();
      ms.forEach(function (m) { m.subtasks.forEach(function (s) { if (s.who && s.who.toLowerCase() === low) { n++; if (s.done) d++; } }); });
      return n ? d + '/' + n + ' tâche' + (n > 1 ? 's' : '') : '';
    };
    var contact = function (phone) {
      return phone ? '<a class="btn btn-sm" href="tel:' + esc(phone.replace(/[^\d+]/g, '')) + '">Appeler</a>' + btn('WhatsApp', 'wa-person', 'btn-sm', ' data-phone="' + esc(phone) + '"') : '';
    };
    var h = '<div class="card mt"><h2>Membres de l\'équipe <span class="chip">' + (t.people.length + (t.lead ? 1 : 0)) + '</span>' +
      (isOrg() ? '<span class="acts">' + btn('👑 Choisir le chef', 'pick-lead', 'btn-gold btn-sm', ' data-id="' + t.id + '"') + '</span>' : '') + '</h2>' +
      (isOrg() ? '' : '<p class="muted small" style="margin:-6px 0 8px">Seul l\'organisateur choisit le chef d\'équipe.' + (edit ? ' Vous pouvez ajouter et modifier les membres.' : '') + '</p>') + '<ul class="members">';
    h += '<li class="is-lead"><span class="avatar" style="background:' + esc(t.color) + '">' + esc((t.lead || '?').charAt(0).toUpperCase()) + '</span><div class="pmain"><b>' + (t.lead ? esc(t.lead) : '<em>Chef à désigner</em>') + ' <span class="chip gold">Chef d\'équipe</span></b>' +
      '<small>' + (t.phone ? esc(t.phone) : 'Pas de téléphone') + (tasksOf(t.lead || '') ? ' · ' + tasksOf(t.lead) : '') + '</small></div>' + contact(t.phone) + '</li>';
    h += t.people.map(function (p) {
      var tk = tasksOf(p.name);
      return '<li><span class="avatar">' + esc(p.name.charAt(0).toUpperCase()) + '</span><div class="pmain"><b>' + esc(p.name) + '</b><small>' + (p.role ? esc(p.role) : 'Rôle à préciser') + (p.phone ? ' · ' + esc(p.phone) : '') + (tk ? ' · ' + tk : '') + '</small></div>' +
        contact(p.phone) + (edit ? '<button class="icon-btn" data-act="edit-member" data-team="' + t.id + '" data-id="' + p.id + '" aria-label="Modifier" title="Modifier">✎</button>' : '') + '</li>';
    }).join('') + '</ul>';
    if (!t.people.length) h += '<p class="muted small" style="margin-top:6px">Pas encore de membres dans cette équipe.</p>';
    if (edit) h += '<form class="add-member" data-form="add-member" data-team="' + t.id + '"><input name="name" placeholder="Nom du membre" aria-label="Nom du membre"><input name="role" placeholder="Son rôle (facultatif)" aria-label="Rôle"><input name="phone" type="tel" placeholder="Téléphone (facultatif)" aria-label="Téléphone"><button class="btn btn-primary btn-sm" type="submit">+ Ajouter</button></form>';
    return h + '</div>';
  }

  function filesCard(ev, t) {
    var fs = teamFiles(ev, t.id), edit = canEditTeam(t.id);
    var h = '<div class="card mt"><h2>Présentations & documents' + (edit ? '<span class="acts"><label class="btn btn-primary btn-sm upload">⬆ Déposer un fichier<input type="file" multiple data-chg="upload" data-team="' + t.id + '"></label></span>' : '') + '</h2>';
    h += '<p class="muted small" style="margin:-6px 0 10px">' + (isOrg() ? 'Le chef d\'équipe dépose ici sa présentation (PowerPoint, PDF, Keynote, Word, images…). Vous pouvez l\'ouvrir ou la télécharger.' : 'Déposez ici la présentation de votre équipe (PowerPoint, PDF, Keynote, Word, images…). L\'organisateur pourra l\'ouvrir et la télécharger.') + '</p>';
    if (!fs.length) h += empty('Aucun document pour le moment.');
    else h += '<ul class="files">' + fs.slice().sort(function (a, b) { return a.at < b.at ? 1 : -1; }).map(function (f) {
      var ext = fileExt(f.name), viewable = /^(pdf|png|jpe?g|gif|webp|mp4|mov|txt)$/.test(ext);
      return '<li><span class="fic">' + esc(ext.slice(0, 4)) + '</span><div class="fmain"><b title="' + esc(f.name) + '">' + esc(f.name) + '</b><small>' + fmtSize(f.size) + ' · déposé par ' + esc(f.by || '—') + ' · ' + fmtStamp(f.at) + '</small></div>' +
        (viewable ? btn('Ouvrir', 'file-open', 'btn-sm', ' data-id="' + f.id + '"') : '') + btn('⬇ Télécharger', 'file-dl', 'btn-sm', ' data-id="' + f.id + '"') +
        (edit ? '<button class="icon-btn" data-act="file-del" data-id="' + f.id + '" aria-label="Supprimer" title="Supprimer">🗑</button>' : '') + '</li>';
    }).join('') + '</ul>';
    return h + '</div>';
  }

  /* ---------- Tâche : responsable, commentaires et fichiers (v5.7) ---------- */
  var subComments = function (ev, sid) { return (ev.comments || []).filter(function (c) { return c.subId === sid; }); };
  function subExtra(ev, m, s, edit, tick) {
    var cs = subComments(ev, s.id), nf = cs.filter(function (c) { return c.fileId; }).length, open = !!ui.openSub[s.id];
    var h = '<div class="sub-extra"><span class="sub-resp">👤 Responsable : ';
    if (edit) {
      var names = teamNames(teamOf(ev, m.teamId));
      if (s.who && names.indexOf(s.who) < 0) names.push(s.who);
      h += '<select data-chg="sub-who" data-m="' + m.id + '" data-s="' + s.id + '" aria-label="Responsable de la tâche"><option value="">— à choisir —</option>' +
        names.map(function (n) { return '<option' + (n === s.who ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') + '</select>';
    } else h += s.who ? '<b>' + esc(s.who) + '</b>' : '<i>pas encore choisi</i>';
    h += '</span><button type="button" class="sub-tog' + (open ? ' on' : '') + '" data-act="sub-thread" data-s="' + s.id + '" aria-expanded="' + open + '">💬 ' + (cs.length ? cs.length + ' commentaire' + (cs.length > 1 ? 's' : '') : 'Commenter') + (nf ? ' · 📎 ' + nf : '') + '</button></div>';
    if (open) h += subThread(ev, m, s, cs, edit, tick);
    return h;
  }
  function subThread(ev, m, s, cs, edit, tick) {
    var me = actor(ev);
    var h = '<div class="sub-thread">';
    if (!cs.length) h += '<p class="muted small">Pas encore de commentaire. ' + (tick ? 'Écrivez où en est le travail ou déposez le fichier (flyer, devis, photo…).' : '') + '</p>';
    else h += '<ul class="cmts">' + cs.slice().sort(function (a, b) { return a.at < b.at ? -1 : 1; }).map(function (c) {
      var f = c.fileId && (ev.files || []).filter(function (x) { return x.id === c.fileId; })[0];
      var ext = f ? fileExt(f.name) : '', viewable = /^(pdf|png|jpe?g|gif|webp|mp4|mov|txt)$/.test(ext);
      return '<li><div class="c-head"><b>' + esc(c.by || '—') + '</b><small>' + fmtStamp(c.at) + '</small>' +
        ((edit || c.by === me) ? '<button class="icon-btn" data-act="cmt-del" data-id="' + c.id + '" aria-label="Supprimer le commentaire" title="Supprimer le commentaire">🗑</button>' : '') + '</div>' +
        (c.text ? '<p>' + esc(c.text).replace(/\n/g, '<br>') + '</p>' : '') +
        (c.fileId ? '<div class="c-file"><span class="fic">' + esc((ext || 'fic').slice(0, 4)) + '</span><span class="c-fname" title="' + esc(c.fileName || '') + '">' + esc(c.fileName || 'Fichier') + (f ? ' <small>' + fmtSize(f.size) + '</small>' : ' <small>(supprimé)</small>') + '</span>' +
          (f ? (viewable ? btn('Ouvrir', 'file-open', 'btn-sm', ' data-id="' + f.id + '"') : '') + btn('⬇ Télécharger', 'file-dl', 'btn-sm', ' data-id="' + f.id + '"') : '') + '</div>' : '') + '</li>';
    }).join('') + '</ul>';
    if (tick) h += '<form class="add-cmt" data-form="add-cmt" data-m="' + m.id + '" data-s="' + s.id + '"><textarea name="text" rows="2" placeholder="Votre commentaire sur « ' + esc(s.title) + ' »…" aria-label="Commentaire"></textarea>' +
      '<div class="c-row"><label class="btn btn-sm upload">📎 Joindre un fichier<input type="file" name="file" data-chg="cmt-file"></label><span class="c-picked muted small"></span><button class="btn btn-primary btn-sm" type="submit">Publier</button></div></form>';
    return h + '</div>';
  }

  function missionCard(ev, m, showTeam) {
    var p = mProg(m), edit = canEditTeam(m.teamId), tick = canTick(m.teamId), t = today();
    var h = '<article class="mission' + (p >= 100 ? ' is-done' : '') + '" id="mis-' + m.id + '"><div class="m-head"><div><h3>' + esc(m.title) + '</h3><div class="m-meta">' +
      (m.priority === 'haute' ? '<span class="chip bad">Priorité haute</span>' : m.priority === 'basse' ? '<span class="chip">Priorité basse</span>' : '') + dlChip(m) +
      moneyChips(m) + (showTeam ? teamChip(ev, m.teamId) : '') + '</div></div><div class="m-pct">' + p + ' %</div>' +
      (edit ? '<div class="m-tools"><button class="btn btn-sm" data-act="edit-mission" data-m="' + m.id + '">✎ Modifier</button><button class="icon-btn danger" data-act="del-mission" data-m="' + m.id + '" aria-label="Supprimer la mission" title="Supprimer la mission">🗑</button></div>' : '') + '</div>' + bar(p);
    if (m.desc) h += '<p class="m-desc">' + esc(m.desc) + '</p>';
    if (m.subtasks.length) {
      h += '<ul class="subs">' + m.subtasks.map(function (s) {
        return '<li class="' + (s.done ? 'done' : '') + '"><label><input type="checkbox" data-chg="sub" data-m="' + m.id + '" data-s="' + s.id + '"' + (s.done ? ' checked' : '') + (tick ? '' : ' disabled') + '><span>' + esc(s.title) + '</span></label>' +
          (s.due ? '<small class="' + (!s.done && s.due < t ? 'late' : '') + '">' + fmtDate(s.due) + '</small>' : '') +
          (edit ? '<span class="sub-tools"><button class="icon-btn" data-act="edit-sub" data-m="' + m.id + '" data-s="' + s.id + '" aria-label="Modifier la tâche" title="Modifier la tâche">✎</button><button class="icon-btn danger" data-act="del-sub" data-m="' + m.id + '" data-s="' + s.id + '" aria-label="Supprimer la tâche" title="Supprimer la tâche">✕</button></span>' : '') + subExtra(ev, m, s, edit, tick) + '</li>';
      }).join('') + '</ul>';
    } else {
      h += '<label class="m-solo"><input type="checkbox" data-chg="mdone" data-m="' + m.id + '"' + (m.done ? ' checked' : '') + (tick ? '' : ' disabled') + '> Mission faite (elle n\'a pas encore de tâches)</label>';
    }
    if (edit) h += '<form class="add-sub" data-form="add-sub" data-m="' + m.id + '"><input name="t" placeholder="Ajouter une tâche à faire…" aria-label="Nouvelle tâche"><button class="btn btn-sm" type="submit">Ajouter</button></form>';
    if (m.question) {
      h += '<div class="qa"><div class="q"><b>Question à l\'organisateur</b>' + esc(m.question) + '</div>' +
        (m.answer ? '<div class="a"><b>Réponse</b>' + esc(m.answer) + '</div>' : '<div class="a none">En attente de réponse</div>') + '</div>';
    }
    h += '<div class="m-actions">';
    if (isOrg()) {
      if (m.question) h += btn(m.answer ? 'Modifier la réponse' : 'Répondre', 'answer', m.answer ? 'btn-sm' : 'btn-gold btn-sm', ' data-m="' + m.id + '"');
      h += btn('Envoyer au chef (WhatsApp)', 'wa-mission', 'btn-sm', ' data-m="' + m.id + '"');
    } else if (edit) {
      h += btn(m.question ? 'Changer ma question' : 'Poser une question', 'ask', 'btn-sm', ' data-m="' + m.id + '"');
    }
    return h + '</div></article>';
  }

  /* ---------- Vue : toutes les missions ---------- */
  function vMissions(ev) {
    var h = vhead('Missions & tâches', 'L\'organisateur attribue une mission à une équipe. Le chef la découpe en tâches. Cliquez sur une mission pour voir le détail.', btn('+ Attribuer une mission', 'new-mission', 'btn-primary'));
    var t = today();
    var F = { all: 'Toutes', late: 'En retard', plan: 'Pas encore découpées', q: 'Questions ouvertes', done: 'Terminées' };
    var test = {
      all: function () { return true; }, late: function (m) { return mProg(m) < 100 && m.deadline && m.deadline < t; }, plan: function (m) { return !m.subtasks.length && !m.done; },
      q: function (m) { return m.question && !m.answer; }, done: function (m) { return mProg(m) >= 100; }
    };
    h += '<div class="filters">' + Object.keys(F).map(function (k) {
      var n = ev.missions.filter(test[k]).length;
      return '<button class="' + (ui.mFilter === k ? 'on' : '') + '" data-act="mfilter" data-f="' + k + '">' + F[k] + ' (' + n + ')</button>';
    }).join('') + '</div>';
    var list = ev.missions.filter(test[ui.mFilter] || test.all);
    if (!list.length) return h + empty('Aucune mission dans cette liste.');
    ev.teams.concat([{ id: '', name: 'Sans équipe', color: '#999' }]).forEach(function (tm) {
      var ms = list.filter(function (m) { return (m.teamId || '') === tm.id || (!tm.id && !teamOf(ev, m.teamId)); });
      if (!ms.length) return;
      h += '<div class="card mt"><h2><span class="dot" style="background:' + esc(tm.color) + '"></span>' + esc(tm.name) + (tm.lead ? ' <span class="muted small" style="font-family:var(--f-body);font-weight:500">· ' + esc(tm.lead) + '</span>' : '') + '</h2>';
      ms.forEach(function (m) {
        var p = mProg(m);
        h += '<div class="mrow" data-act="toggle-mission" data-m="' + m.id + '"><div class="mr-main"><b>' + esc(m.title) + '</b><small>' + m.subtasks.filter(function (s) { return s.done; }).length + '/' + m.subtasks.length + ' tâches' + (m.question && !m.answer ? ' · question en attente' : '') + '</small></div>' +
          dlChip(m) + bar(p) + '<span class="pct">' + p + ' %</span></div>';
        if (ui.open[m.id]) h += '<div style="padding:10px 0 4px">' + missionCard(ev, m, false) + '</div>';
      });
      h += '</div>';
    });
    return h;
  }

  /* ---------- Vue : programme ---------- */
  function vProgram(ev) {
    var h = vhead('Programme', 'Le déroulé minute par minute. Chaque moment a une équipe responsable.', (isOrg() ? btn('+ Ajouter un moment', 'new-prog', 'btn-primary') : '') + btn('Imprimer', 'print', ''));
    var days = daysRange(ev.start, ev.end);
    var extra = ev.program.filter(function (p) { return days.indexOf(p.day) < 0; }).map(function (p) { return p.day; });
    days = days.concat(extra.filter(function (d, i) { return extra.indexOf(d) === i; })).sort();
    if (!ev.program.length) return h + empty('Le programme est vide. ' + (isOrg() ? 'Ajoutez le premier moment.' : 'L\'organisateur ne l\'a pas encore rempli.'));
    days.forEach(function (d, i) {
      var items = progOfDay(ev, d);
      h += '<div class="day"><h2>Jour ' + (i + 1) + ' · ' + fmtDate(d, true) + '</h2>';
      h += items.length ? '<ul class="prog prog-box">' + items.map(function (p) { return progRow(ev, p, false); }).join('') + '</ul>' : empty('Rien de prévu ce jour-là.');
      h += '</div>';
    });
    return h;
  }
  function progOfDay(ev, d) { return ev.program.filter(function (p) { return p.day === d; }).sort(function (a, b) { return a.start < b.start ? -1 : 1; }); }
  function duration(p) { var a = toMin(p.start), b = toMin(p.end); if (a == null || b == null || b <= a) return ''; var m = b - a; return (m >= 60 ? Math.floor(m / 60) + ' h ' : '') + (m % 60 ? m % 60 + ' min' : '').trim(); }
  function progRow(ev, p, live, cls) {
    return '<li class="' + (cls || '') + (p.done ? ' done' : '') + '">' + (live ? '<input type="checkbox" data-chg="prog-done" data-id="' + p.id + '"' + (p.done ? ' checked' : '') + ' aria-label="Fait">' : '') +
      '<div class="tm">' + esc(p.start) + (p.end ? ' – ' + esc(p.end) : '') + '<small>' + duration(p) + '</small></div><div class="pt"><b>' + esc(p.title) + '</b>' + (p.notes ? '<small>' + esc(p.notes) + '</small>' : '') + '</div>' +
      (p.teamId ? teamChip(ev, p.teamId) : '') + (isOrg() ? '<button class="icon-btn" data-act="edit-prog" data-id="' + p.id + '" aria-label="Modifier" title="Modifier">✎</button>' : '') + '</li>';
  }

  /* ---------- Réunions ----------
     scope : 'all' (toutes les équipes), 'teams' (équipes choisies), 'leads' (les chefs avec l'organisateur).
     Réponses (rsvp) : 'org' pour l'organisateur, 'L:<équipe>' pour un chef, l'id de la personne pour un membre. */
  var SCOPES = { all: 'Toutes les équipes', teams: 'Équipes choisies', leads: 'Les chefs d\'équipe avec l\'organisateur' };
  function mtTeams(ev, mt) { return mt.scope === 'teams' ? ev.teams.filter(function (t) { return mt.teamIds.indexOf(t.id) >= 0; }) : ev.teams.slice(); }
  function mtInvited(ev, mt, tid) { return mtTeams(ev, mt).some(function (t) { return t.id === tid; }); }
  function mtPeople(ev, mt) {
    var out = [];
    if (mt.scope !== 'teams' || !mt.byTeam) out.push({ k: 'org', name: state.orgName || 'Organisateur', role: 'Organisateur', teamId: '' });
    mtTeams(ev, mt).forEach(function (t) {
      out.push({ k: 'L:' + t.id, name: t.lead || 'Chef à désigner', role: 'Chef · ' + t.name, teamId: t.id, color: t.color });
      if (mt.scope !== 'leads') t.people.forEach(function (p) { out.push({ k: p.id, name: p.name, role: t.name, teamId: t.id, color: t.color }); });
    });
    return out;
  }
  var canEditMt = function (mt) { return isOrg() || (isLead() && !!mt.byTeam && mt.byTeam === myTeam()); };
  var canAnswer = function (p) { return isOrg() || (!!p.teamId && p.teamId === myTeam()); };
  var mtUpcoming = function (mt) { return mt.date >= today(); };
  function mtVisible(ev, mt) { return isOrg() || mtInvited(ev, mt, myTeam()) || (mt.byTeam && mt.byTeam === myTeam()); }
  function mtWhen(mt) { return fmtDate(mt.date, true) + (mt.time ? ' à ' + mt.time.replace(':', 'h') : '') + (mt.end ? ' – ' + mt.end.replace(':', 'h') : ''); }
  function mtWho(ev, mt) { return mt.scope === 'teams' ? mtTeams(ev, mt).map(function (t) { return t.name; }).join(', ') || 'aucune équipe' : SCOPES[mt.scope]; }
  function mtCount(ev, mt) {
    var ps = mtPeople(ev, mt), y = 0, n = 0;
    ps.forEach(function (p) { if (mt.rsvp[p.k] === 'yes') y++; else if (mt.rsvp[p.k] === 'no') n++; });
    return { all: ps.length, yes: y, no: n, wait: ps.length - y - n };
  }

  /* Bandeau des prochaines réunions : tableau de bord (tid = null) ou page d'une équipe invitée. */
  function meetingsStrip(ev, tid) {
    var list = (ev.meetings || []).filter(function (mt) { return mtUpcoming(mt) && (!tid || mtInvited(ev, mt, tid) || mt.byTeam === tid); })
      .sort(function (a, b) { return (a.date + a.time) < (b.date + b.time) ? -1 : 1; }).slice(0, 3);
    var can = isOrg() || (isLead() && tid && tid === myTeam());
    if (!list.length && !can) return '';
    var h = '<div class="card mt mt-strip"><h2>Prochaines réunions<span class="acts">' + (can ? btn('+ Nouvelle réunion', 'new-meeting', 'btn-sm btn-gold') : '') + btn('Toutes les réunions', 'go', 'btn-sm', ' data-v="meetings"') + '</span></h2>';
    if (!list.length) return h + '<p class="muted small">Aucune réunion prévue.</p></div>';
    return h + list.map(function (mt) {
      var c = mtCount(ev, mt), d = parseD(mt.date);
      return '<div class="evrow" data-act="open-meeting" data-id="' + mt.id + '" tabindex="0" role="button"><div class="evdate"><b>' + d.getDate() + '</b><span>' + d.toLocaleDateString('fr-FR', { month: 'short' }).replace('.', '') + '</span></div>' +
        '<div class="evmain"><b>' + esc(mt.title) + '</b><small>' + (mt.time ? mt.time.replace(':', 'h') + ' · ' : '') + esc(mt.link ? 'en visio' : mt.place || 'lieu à préciser') + ' · ' + esc(mtWho(ev, mt)) + '</small></div>' +
        '<span class="chip ok">' + c.yes + ' viennent</span>' + (c.wait ? '<span class="chip">' + c.wait + ' sans réponse</span>' : '') + '<span class="evgo" aria-hidden="true">›</span></div>';
    }).join('') + '</div>';
  }

  function vMeetings(ev) {
    var can = isOrg() || isLead();
    var h = vhead('Réunions', isOrg() ? 'Préparez les réunions de l\'événement : avec toutes les équipes, certaines équipes, ou seulement les chefs. Chacun répond « je viens » ou « je ne viens pas ».' : 'Les réunions où votre équipe est invitée. Répondez « je viens » ou « je ne viens pas ».' + (isLead() ? ' Vous pouvez aussi organiser une réunion de votre équipe ou avec une autre équipe.' : ''),
      can ? btn('+ Nouvelle réunion', 'new-meeting', 'btn-primary') : '');
    var all = (ev.meetings || []).filter(function (mt) { return mtVisible(ev, mt); });
    var up = all.filter(mtUpcoming).sort(function (a, b) { return (a.date + a.time) < (b.date + b.time) ? -1 : 1; });
    var past = all.filter(function (mt) { return !mtUpcoming(mt); }).sort(function (a, b) { return (a.date + a.time) < (b.date + b.time) ? 1 : -1; });
    if (!all.length) return h + empty('Aucune réunion pour le moment.' + (can ? ' Cliquez sur « + Nouvelle réunion ».' : ''));
    if (up.length) h += '<h2 class="sec-title">À venir</h2>' + up.map(function (mt) { return meetingCard(ev, mt); }).join('');
    if (past.length) h += '<h2 class="sec-title">Passées</h2>' + past.map(function (mt) { return meetingCard(ev, mt); }).join('');
    return h;
  }

  function meetingCard(ev, mt) {
    var c = mtCount(ev, mt), edit = canEditMt(mt), open = ui.open['mt-' + mt.id], isUp = mtUpcoming(mt), ps = mtPeople(ev, mt);
    var me = isOrg() ? 'org' : isLead() && myTeam() ? 'L:' + myTeam() : null;
    var h = '<article class="mission meeting' + (isUp ? '' : ' is-past') + '" id="mt-' + mt.id + '"><div class="m-head"><div><h3>' + esc(mt.title) + '</h3><div class="m-meta">' +
      '<span class="chip gold">' + esc(mtWhen(mt)) + '</span>' + (mt.place ? '<span class="chip">📍 ' + esc(mt.place) + '</span>' : '') +
      (safeUrl(mt.link) ? '<a class="chip" href="' + esc(safeUrl(mt.link)) + '" target="_blank" rel="noopener">🎥 Rejoindre en visio</a>' : '') +
      '<span class="chip">👥 ' + esc(mtWho(ev, mt)) + '</span>' + (mt.minutes ? '<span class="chip ok">Compte rendu</span>' : '') + '</div></div>' +
      (edit ? '<div class="m-tools"><button class="btn btn-sm" data-act="edit-meeting" data-id="' + mt.id + '">✎ Modifier</button></div>' : '') + '</div>';
    if (mt.agenda) h += '<div class="m-desc"><b>Ordre du jour</b><ol class="agenda">' + mt.agenda.split('\n').filter(function (l) { return l.trim(); }).map(function (l) { return '<li>' + esc(l.replace(/^[-•\d.)\s]+/, '')) + '</li>'; }).join('') + '</ol></div>';
    if (me && isUp && ps.some(function (p) { return p.k === me; })) {
      var r = mt.rsvp[me];
      h += '<div class="rsvp-me"><span>Vous venez ?</span>' + btn('✓ Je viens', 'rsvp', 'btn-sm' + (r === 'yes' ? ' btn-ok' : ''), ' data-id="' + mt.id + '" data-k="' + me + '" data-v="yes"') +
        btn('✕ Je ne viens pas', 'rsvp', 'btn-sm' + (r === 'no' ? ' btn-danger' : ''), ' data-id="' + mt.id + '" data-k="' + me + '" data-v="no"') + '</div>';
    }
    h += '<button class="rsvp-sum" data-act="toggle-mt" data-id="' + mt.id + '"><span class="chip ok">' + c.yes + ' viennent</span><span class="chip bad">' + c.no + ' ne viennent pas</span><span class="chip">' + c.wait + ' sans réponse</span><span class="muted small">' + (open ? '▲ Masquer la liste' : '▼ Voir qui vient') + '</span></button>';
    if (open) {
      h += '<ul class="members rsvp-list">' + ps.map(function (p) {
        var r = mt.rsvp[p.k], ok = canAnswer(p);
        return '<li><span class="avatar"' + (p.color ? ' style="background:' + esc(p.color) + '"' : '') + '>' + esc(p.name.charAt(0).toUpperCase()) + '</span><div class="pmain"><b>' + esc(p.name) + '</b><small>' + esc(p.role) + '</small></div>' +
          (ok ? '<button class="rs ' + (r === 'yes' ? 'on-yes' : '') + '" data-act="rsvp" data-id="' + mt.id + '" data-k="' + p.k + '" data-v="yes" title="Vient">✓</button><button class="rs ' + (r === 'no' ? 'on-no' : '') + '" data-act="rsvp" data-id="' + mt.id + '" data-k="' + p.k + '" data-v="no" title="Ne vient pas">✕</button>'
            : '<span class="chip ' + (r === 'yes' ? 'ok' : r === 'no' ? 'bad' : '') + '">' + (r === 'yes' ? 'Vient' : r === 'no' ? 'Ne vient pas' : 'Pas de réponse') + '</span>') + '</li>';
      }).join('') + '</ul><p class="muted small">' + (isOrg() ? 'Vous pouvez noter la réponse de chacun.' : 'Chaque membre peut noter sa réponse ; le chef peut le faire pour son équipe.') + '</p>';
    }
    if (mt.minutes) {
      h += '<div class="qa"><div class="q"><b>Décisions</b>' + esc(mt.minutes.decisions || '—').replace(/\n/g, '<br>') + '</div>' + (mt.minutes.notes ? '<div class="a"><b>Notes</b>' + esc(mt.minutes.notes).replace(/\n/g, '<br>') + '</div>' : '') + '</div>';
    }
    if (mt.tasks && mt.tasks.length) h += '<p class="small mt"><b>Tâches ajoutées aux missions :</b> ' + mt.tasks.map(function (x) { return esc(x.title) + ' <span class="muted">(' + esc((teamOf(ev, x.teamId) || {}).name || '—') + ')</span>'; }).join(' · ') + '</p>';
    h += '<div class="m-actions">' + btn('Envoyer par WhatsApp', 'wa-meeting', 'btn-sm', ' data-id="' + mt.id + '"');
    if (edit || isLead() && mtInvited(ev, mt, myTeam())) h += btn(mt.minutes ? '✎ Compte rendu' : '📝 Écrire le compte rendu', 'mt-minutes', 'btn-sm' + (!isUp && !mt.minutes ? ' btn-gold' : ''), ' data-id="' + mt.id + '"');
    if (isOrg() || isLead()) h += btn('+ Ajouter une tâche aux missions', 'mt-task', 'btn-sm', ' data-id="' + mt.id + '"');
    if (mt.minutes) h += btn('Partager le compte rendu', 'wa-minutes', 'btn-sm', ' data-id="' + mt.id + '"');
    return h + '</div></article>';
  }

  function formMeeting(ev, mt) {
    var lead = !isOrg(), my = myTeam();
    var teamsOpts = ev.teams.map(function (t) { return [t.id, '<span class="dot" style="background:' + esc(t.color) + '"></span>' + esc(t.name) + (t.lead ? ' <small class="muted">(' + esc(t.lead) + ')</small>' : '')]; });
    var fields = [
      { k: 'title', label: 'Titre', req: true, ph: 'Ex. : Point des chefs d\'équipe' },
      { k: 'date', label: 'Date', type: 'date', req: true, half: true, def: addDays(today(), 7) }, { k: 'time', label: 'Heure', type: 'time', half: true, def: '19:30' },
      { k: 'end', label: 'Fin (facultatif)', type: 'time', half: true }, { k: 'place', label: 'Lieu', half: true, ph: 'Salle, adresse…' },
      { k: 'link', label: 'Lien visio (facultatif)', type: 'url', ph: 'Lien Zoom, Teams ou groupe WhatsApp' },
      { k: 'agenda', label: 'Ordre du jour (un point par ligne)', type: 'textarea', rows: 4, ph: 'Tour des équipes\nBudget\nQuestions' }
    ];
    if (lead) fields.push({ type: 'note', k: '_s', html: 'Votre équipe est invitée. Cochez les autres équipes à inviter si besoin.' });
    else fields.push({ k: 'scope', label: 'Qui est invité ?', type: 'select', options: Object.keys(SCOPES).map(function (k) { return [k, SCOPES[k]]; }), def: 'all' });
    fields.push({ k: 'teamIds', label: lead ? 'Autres équipes invitées' : 'Équipes invitées (si « Équipes choisies »)', type: 'checks', options: lead ? teamsOpts.filter(function (o) { return o[0] !== my; }) : teamsOpts, def: [] });
    openForm(mt ? 'Modifier la réunion' : 'Nouvelle réunion', fields, mt, function (v) {
      if (lead) { v.scope = 'teams'; v.teamIds = [my].concat(v.teamIds); }
      if (v.scope === 'teams' && !v.teamIds.length) { toast('Choisissez au moins une équipe.'); return false; }
      if (mt) { Object.assign(mt, v); log(ev, 'a modifié la réunion « ' + mt.title + ' ».'); return; }
      var n = Object.assign({ id: uid('mt'), by: actor(ev), byTeam: lead ? my : '', rsvp: {}, minutes: null, tasks: [], createdAt: new Date().toISOString() }, v);

    }, mt ? { onDelete: function () {

      log(ev, 'a supprimé la réunion « ' + mt.title + ' ».');
    } } : null);
  }

  /* ---------- Vue : budget ---------- */
  function vBudget(ev) {

    var rec = sum(ev.contributions.filter(function (c) { return c.status === 'recu'; }), 'amount');
    var prom = sum(ev.contributions.filter(function (c) { return c.status === 'promesse'; }), 'amount');
    var toPay = sum(ev.expenses.filter(function (x) { return !x.reimbursed; }), 'amount');
    var goal = Number(ev.goal) || 0;
    var h = vhead('Budget & finances', 'Chaque équipe demande un budget pour ses missions, vous accordez un montant, l\'équipe note ses achats. Une équipe passe au vert quand son chef a terminé ses comptes.',
      btn('+ Dépense', 'new-exp', 'btn-primary') + btn('+ Contribution', 'new-contrib', ''));
    h += '<div class="kpis">' +
      '<div class="kpi"><b>' + fmtMoney(pl) + '</b><span>budget prévu' + (ev.budget ? '' : ' (montants accordés aux équipes)') + '</span></div>' +
      '<div class="kpi"><b>' + fmtMoney(spent) + '</b><span>dépensé' + (pl ? ' · ' + Math.round(spent / pl * 100) + ' % du budget' : '') + '</span></div>' +
      '<div class="kpi"><b>' + fmtMoney(rec) + '</b><span>reçu' + (prom ? ' + ' + fmtMoney(prom) + ' promis' : '') + (goal ? ' · objectif ' + fmtMoney(goal) : '') + '</span></div>' +
      '<div class="kpi ' + (rec - spent >= 0 ? 'gold' : '') + '"><b style="color:' + (rec - spent >= 0 ? 'var(--green)' : 'var(--red)') + '">' + fmtMoney(rec - spent) + '</b><span>solde (reçu − dépensé)</span></div></div>';
    if (toPay) h += '<div class="banner warn"><span class="big">€</span>' + fmtMoney(toPay) + ' restent à rembourser aux personnes qui ont avancé de l\'argent.</div>';
    var need = alertsFor(ev).filter(function (a) { return a.go === 'budget'; });

    var rows = ev.teams.map(function (t) { return { t: t, f: teamFin(ev, t) }; });

      rows.map(function (r) {
        var t = r.t, f = r.f, open = ui.open['fin-' + t.id];
        var stc = t.fin ? '<span class="chip ok">✓ Comptes complets</span>' : f.waiting.length ? '<span class="chip warn">' + plur(f.waiting.length, 'demande', 'demandes') + ' en attente</span>' : f.spent ? '<span class="chip">Achats en cours</span>' : '<span class="chip">—</span>';
        var row = '<tr class="' + (t.fin ? 'fin-ok' : '') + '" data-act="toggle-fin" data-id="' + t.id + '"><td><span class="dot" style="background:' + esc(t.color) + '"></span> <b>' + esc(t.name) + '</b>' + (t.lead ? '<br><small class="muted">' + esc(t.lead) + '</small>' : '') + '</td>' +
          '<td class="num">' + (f.req ? fmtMoney(f.req) : '—') + '</td><td class="num">' + (f.hasAlloc ? fmtMoney(f.alloc) : '—') + '</td>' +
          '<td class="num"' + (f.hasAlloc && f.spent > f.alloc ? ' style="color:var(--red);font-weight:700"' : '') + '>' + fmtMoney(f.spent) + '</td><td class="num">' + (f.hasAlloc ? fmtMoney(f.left) : '—') + '</td>' +
          '<td>' + stc + '</td><td class="c">' + btn('✎ Montants', 'set-alloc', 'btn-sm' + (f.waiting.length ? ' btn-gold' : ''), ' data-id="' + t.id + '" title="Modifier les montants accordés à cette équipe"') + '</td></tr>';
        if (open) row += '<tr class="fin-detail"><td colspan="7">' + finDetail(ev, t) + '</td></tr>';
        return row;
      }).join('') + '</tbody><tfoot><tr><td>Total</td><td class="num">' + fmtMoney(T.req) + '</td><td class="num">' + fmtMoney(T.alloc) + '</td><td class="num">' + fmtMoney(T.spent) + '</td><td class="num">' + fmtMoney(T.alloc - T.spent) + '</td><td colspan="2"></td></tr></tfoot></table></div>' +
      '<p class="muted small mt">Touchez une équipe pour voir le détail : missions, montants et achats.</p>' : empty('Pas encore d\'équipe.')) + '</div>';

    var ex = ev.expenses.slice().sort(function (a, b) { return (b.date || '') < (a.date || '') ? -1 : 1; });
    h += '<div class="grid g2 mt"><div class="card"><h2>Toutes les dépenses <span class="acts">' + btn('+ Ajouter', 'new-exp', 'btn-sm') + '</span></h2>' + (ex.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Payé par</th><th>Quoi</th><th class="num">Montant</th><th class="c">Remboursé</th></tr></thead><tbody>' +
      ex.map(function (x) {
        return '<tr><td><a href="#" data-act="edit-exp" data-id="' + x.id + '"><b>' + esc(x.who) + '</b></a><br><small class="muted">' + fmtDate(x.date) + '</small></td><td>' + esc(x.what) + (x.receiptId ? ' <a href="#" data-act="receipt" data-id="' + x.id + '" title="Voir le ticket">📷</a>' : '') + (x.teamId ? '<br>' + teamChip(ev, x.teamId) : '') + '</td><td class="num">' + fmtMoney(x.amount) + '</td>' +
          '<td class="c"><input type="checkbox" data-chg="reimb" data-id="' + x.id + '"' + (x.reimbursed ? ' checked' : '') + ' aria-label="Remboursé"></td></tr>';
      }).join('') + '</tbody><tfoot><tr><td colspan="2">Total</td><td class="num">' + fmtMoney(spent) + '</td><td></td></tr></tfoot></table></div>' : empty('Aucune dépense notée.')) + '</div>';
    h += '<div class="card"><h2>Contributions <span class="acts">' + btn('+ Ajouter', 'new-contrib', 'btn-sm') + '</span></h2>' +
      '<div class="pot-head">' + (goal ? '<p><b>' + fmtMoney(rec) + '</b> reçus sur <b>' + fmtMoney(goal) + '</b> (' + Math.round(rec / goal * 100) + ' %)</p>' + bar(Math.round(rec / goal * 100)) : '<p class="muted small">Ajoutez un objectif de collecte et le lien de la cagnotte PayPal dans « Modifier l\'événement ».</p>') +
      '<p class="small">' + (safeUrl(ev.paypal) ? 'Cagnotte : <a href="' + esc(safeUrl(ev.paypal)) + '" target="_blank" rel="noopener">' + esc(ev.paypal.replace(/^https?:\/\//, '').slice(0, 40)) + '</a> · ' : '') + '<a href="#" data-act="edit-event" data-id="' + ev.id + '">' + (ev.paypal ? 'modifier' : '+ ajouter le lien de la cagnotte') + '</a></p></div>' +
      quickContrib() +
      (ev.contributions.length ? '<div class="tbl-wrap mt"><table class="tbl"><thead><tr><th>Nom</th><th class="num">Montant</th><th>Statut</th></tr></thead><tbody>' +

    }
  });
  // La liste se met à jour toute seule toutes les 30 secondes quand la rubrique est ouverte.
  setInterval(function () { if (ui.view === 'regs' && ON.on && !document.hidden && $('#modal').hidden && !REG.busy) regLoad(true); }, 30000);

  /* ----- Démarrage ----- */
  function cloudStart() {
    // v6.0 : page publique d'inscription (sans compte) : on n'ouvre pas l'application.
    var pm = /[?&]inscription=([A-Za-z0-9-]{3,60})/.exec(location.search) || /\/([a-z0-9-]{3,60})\/inscription\/?$/i.exec(location.pathname), pt = /[?&]ma=([0-9a-fA-F-]{36})/.exec(location.search);
    if (pm || pt) { pubStart(pm ? pm[1] : '', pt ? pt[1] : ''); return; }
    var m = /[?&]invite=([A-Za-z0-9]+)/.exec(location.search);
    if (m) {
      try { sessionStorage.setItem('emp_invite', m[1].toUpperCase()); } catch (e) { CL.invite = m[1].toUpperCase(); }
      try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { /* rien */ }
    }
    try { CL.invite = CL.invite || sessionStorage.getItem('emp_invite'); } catch (e) { /* rien */ }
    if (!Cloud.configured()) { render(); return; }
    var local = lsGet(KEY + '_mode') === 'local' && !CL.invite, last = lsGet(KEY + '_space');
    if (local) render(); else clShow('<p class="muted cl-wait">Connexion…</p>');
    Cloud.onAuth(function (ev) { if (ev === 'PASSWORD_RECOVERY') clNewPw(); });
    Cloud.init().then(function () {
      if (local) return;
      if (!Cloud.user()) {
        CL.mode = CL.invite ? 'signup' : 'signin'; clAuth();
        loadInvite().then(function () { var b = $('#cl-inv'); if (b) b.outerHTML = inviteBanner(); });
        return;
      }
      afterLogin();
    }).catch(function () {
      if (local) return;
      if (last && lsGet(KEY + '_cloud_' + last)) openSpace(last).catch(noop);
      else { clHide(); render(); toast('Pas de connexion internet : vous travaillez sur cet appareil.'); }
    });
  }

  /* ---------- Branchements ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    if (el.tagName === 'A') e.preventDefault();
    var fn = ACT[el.getAttribute('data-act')];
    if (fn) fn(el, curEv());
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('#modal').hidden) closeModal();
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card[data-act]')) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('change', function (e) {
    var el = e.target, k = el.getAttribute && el.getAttribute('data-chg');
    if (!k || !CHG[k]) return;
    var r = CHG[k](el, curEv());
    save(); if (r !== 'norender') render();
    // v6.0 : une liste déroulante qui garde le focus bloquait les mises à jour (il fallait cliquer ailleurs).
    if (el.tagName === 'SELECT' && document.activeElement === el) el.blur();
    if (ON.q.length) flushQ();
  });
  // v6.0 : dès qu'on quitte un champ, ce qui attendait (changements reçus, listes de personnes) s'affiche tout de suite.
  document.addEventListener('focusout', function () {
    setTimeout(function () {
      if (!safeNow()) return;
      if (ON.q.length) { clearTimeout(ON.qt); flushQ(); }
      if (ON.peopleDirty) peopleRedraw(false);
    }, 0);
  });
  document.addEventListener('input', function (e) {
    var ck = e.target.getAttribute && e.target.getAttribute('data-chg');
    if (ck === 'debrief' || ck === 'org-name') { CHG[ck](e.target, curEv()); clearTimeout(ui.typeT); ui.typeT = setTimeout(save, 600); return; }
    if (e.target.getAttribute('data-input') === 'people-filter') {
      var q = e.target.value.trim().toLowerCase();
      document.querySelectorAll('#people-tbl tbody tr').forEach(function (tr) { tr.style.display = !q || tr.getAttribute('data-name').indexOf(q) >= 0 ? '' : 'none'; });
    }
  });
  document.addEventListener('submit', function (e) {
    var f = e.target;
    if (f.id === 'cl-form') { e.preventDefault(); clSubmit(f); return; }
    if (f.id === 'm-form') {
      e.preventDefault();
      if (!formCtx) return;
      var v = readForm(); if (!v) return;
      var cb = formCtx.onSave;
      closeModal();
      if (cb(v) !== false) { save(); render(); }
      return;
    }
    if (f.getAttribute('data-form') === 'add-member') {
      e.preventDefault();
      var ev2 = curEv(), t2 = teamOf(ev2, f.getAttribute('data-team')), nm = f.querySelector('[name=name]');
      if (!nm.value.trim()) { nm.classList.add('is-invalid'); nm.focus(); setTimeout(function () { nm.classList.remove('is-invalid'); }, 1200); return; }
      var np = { id: uid('pm'), name: nm.value.trim(), role: f.querySelector('[name=role]').value.trim(), phone: f.querySelector('[name=phone]').value.trim() };
      t2.people.push(np);
      log(ev2, 'a ajouté ' + np.name + ' à l\'équipe « ' + t2.name + ' ».');
      save(); render(); toast(np.name + ' fait maintenant partie de l\'équipe « ' + t2.name + ' ».');
      var again2 = document.querySelector('form[data-form="add-member"] [name=name]'); if (again2) again2.focus();
      return;
    }
    if (f.getAttribute('data-form') === 'add-contrib') {
      e.preventDefault();
      var ev3 = curEv(), who = f.querySelector('[name=who]'), am = f.querySelector('[name=amount]'), amount = parseFloat(String(am.value).replace(',', '.')) || 0;
      if (!who.value.trim() || amount <= 0) { (who.value.trim() ? am : who).classList.add('is-invalid'); setTimeout(function () { who.classList.remove('is-invalid'); am.classList.remove('is-invalid'); }, 1200); return; }
      ev3.contributions.push({ id: uid('c'), who: who.value.trim(), amount: amount, status: 'recu', note: '', at: new Date().toISOString() });
      log(ev3, 'a noté un don reçu de ' + who.value.trim() + ' (' + fmtMoney(amount) + ').');
      save(); render(); toast('Don de ' + fmtMoney(amount) + ' noté. Merci !');
      var again3 = document.querySelector('form[data-form="add-contrib"] [name=who]'); if (again3) again3.focus();
      return;
    }
    if (f.getAttribute('data-form') === 'add-cmt') {
      e.preventDefault();
      var evc = curEv(), mc = findM(evc, f), sc = mc.subtasks.filter(function (x) { return x.id === f.getAttribute('data-s'); })[0];
      var ta = f.querySelector('[name=text]'), fi = f.querySelector('[name=file]'), txt = ta.value.trim(), file = fi.files && fi.files[0];
      if (!txt && !file) { ta.classList.add('is-invalid'); ta.focus(); setTimeout(function () { ta.classList.remove('is-invalid'); }, 1200); return; }
      if (file && file.size > maxFile()) { toast('« ' + file.name + ' » est trop lourd (plus de ' + Math.round(maxFile() / 1048576) + ' Mo).'); return; }
      var cm = { id: uid('cm'), subId: sc.id, missionId: mc.id, teamId: mc.teamId, text: txt, by: actor(evc), at: new Date().toISOString() };
      var post = function () {
        evc.comments.push(cm); ui.openSub[sc.id] = true;
        log(evc, (cm.fileId ? 'a déposé « ' + cm.fileName + ' » sur' : 'a commenté') + ' la tâche « ' + sc.title + ' » (' + mc.title + ').');
        save(); render(); toast(cm.fileId ? 'Fichier et commentaire publiés.' : 'Commentaire publié.');
      };
      if (!file) return post();
      var meta = { id: uid('f'), teamId: mc.teamId, subId: sc.id, missionId: mc.id, name: file.name, size: file.size, type: file.type || '', at: cm.at, by: cm.by };
      f.querySelector('[type=submit]').disabled = true;
      Files.put(meta.id, file).then(function () {
        evc.files.push(meta); cm.fileId = meta.id; cm.fileName = file.name; post();
      }).catch(function () { f.querySelector('[type=submit]').disabled = false; toast('Impossible d\'enregistrer « ' + file.name + ' » (mémoire du navigateur pleine ?).'); });
      return;
    }
    if (f.getAttribute('data-form') === 'add-sub') {
      e.preventDefault();
      var ev = curEv(), m = findM(ev, f), inp = f.querySelector('input'), title = inp.value.trim();
      if (!title) { inp.classList.add('is-invalid'); setTimeout(function () { inp.classList.remove('is-invalid'); }, 1200); return; }
      m.subtasks.push({ id: uid('s'), title: title, done: false, who: '', due: '' });
      if (m.done) m.done = false;
      log(ev, 'a ajouté la tâche « ' + title + ' » (' + m.title + ').');
      resetOk(ev, m.teamId, 'nouvelle tâche ajoutée');
      save(); render();
      var again = document.querySelector('form[data-m="' + m.id + '"] input'); if (again) again.focus();
    }
  });
  function setRole(v) {
    var p = v.split(':');
    if (ON.on && (v === 'org' || ON.tr[p[1]] !== p[0])) return render();
    state.role = v === 'org' ? { kind: 'org' } : { kind: p[0], catId: p[1] };
    ui.view = v === 'org' ? (ui.evOpen ? 'dash' : 'home') : 'myteam'; if (v !== 'org') ui.evOpen = true;
    if (ON.on) lsSet(KEY + '_team_' + ON.space.id, v);
    save(); closeSide(); render(); window.scrollTo(0, 0);
    var c = v === 'org' ? null : catOf(p[1]), t = c && teamByCat(curEv(), c.id);
    if (ON.on) return toast('Équipe « ' + (c ? c.name : '') + ' » : vous y êtes ' + (p[0] === 'lead' ? 'chef (budget, dépenses, missions).' : 'membre (vos tâches, sans les montants).'));
    toast(!c ? 'Vous êtes l\'organisateur général.' : p[0] === 'lead' ? 'Vous voyez l\'application comme ' + ((t || c).lead || 'le chef') + ', chef de « ' + c.name + ' ».' : 'Vous voyez l\'application comme un membre de « ' + c.name + ' ».');
  }
  $('#role-sel').addEventListener('change', function (e) {
    var v = e.target.value;
    if (v === 'org' && !isOrg() && state.orgPin) {
      e.target.value = state.role.kind + ':' + state.role.catId;
      openForm('Code organisateur', [{ k: 'pin', label: 'Entrez le code organisateur', type: 'password', req: true }], {}, function (f) {
        if (f.pin !== state.orgPin) { toast('Code incorrect.'); return false; }
        setRole('org');
      }, { saveLabel: 'Entrer' });
      return;
    }
    setRole(v);
  });
  $('#ev-sel').addEventListener('change', function (e) {
    ui.liveDay = null;
    if (!e.target.value) { save(); go('home'); return; }
    state.eventId = e.target.value; ui.evOpen = true; save(); go(isOrg() ? 'dash' : 'myteam');
  });
  $('#import-file').addEventListener('change', function (e) {
    var file = e.target.files[0]; if (!file) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var s = JSON.parse(rd.result);
        if (!s || s.v !== 2 || !Array.isArray(s.events)) throw new Error('format');
        migrate(s);
        if (!confirm('Remplacer les données de cet appareil par celles du fichier « ' + file.name + ' » ?')) return;
        state = s; ui.view = null; save(); render(); toast('Sauvegarde importée.');
      } catch (err) { toast('Ce fichier n\'est pas une sauvegarde Event Manager Pro.'); }
      e.target.value = '';
    };
    rd.readAsText(file);
  });
  var toastT;
  function toast(msg) { var t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('on'); }, 3200); }

  // Le jour J, l'écran en direct se met à jour chaque minute.
  setInterval(function () { if (ui.view === 'live' && $('#modal').hidden && !document.activeElement.matches('input,textarea,select')) render(); }, 60000);

  cloudStart();
  window.EMP = { state: function () { return state; }, version: APP_VERSION, cloud: ON, save: function () { save(); render(); }, decompose: function () { return decompose(state); } };
})();
</script>
</body>
</html>
